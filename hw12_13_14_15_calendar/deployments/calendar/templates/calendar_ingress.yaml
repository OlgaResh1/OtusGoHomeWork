apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calendar-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: calendar.local
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: calendar-http-service
            port:
              number: {{ .Values.app.http.targetPort }}
